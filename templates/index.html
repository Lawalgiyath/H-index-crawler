<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Scholar Bulk Scraper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 8px;
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .forms-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .search-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            flex: 1;
        }
        
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input[type="text"], input[type="file"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
            width: 100%;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
            margin-top: 10px;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }
        
        .results-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .download-buttons {
            display: flex;
            gap: 10px;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        
        .results-table thead {
            background: #f8f9fa;
        }
        
        .results-table th {
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #666;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .results-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        
        .results-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-weight: bold;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .progress-container {
            display: none;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .forms-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 Bulk Document Scraper</h1>
            <p class="subtitle">Upload a document to crawl Scholar metrics for an entire department</p>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalCount">{{ count }}</div>
                    <div class="stat-label">Total Profiles Scraped</div>
                </div>
            </div>
        </div>
        
        <div class="forms-container">
            <!-- Individual Search Section -->
            <div class="search-section">
                <h2 style="margin-bottom: 20px; color: #333;">Single Profile Search</h2>
                <div id="singleStatusMessage" class="status-message"></div>
                
                <form id="singleSearchForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="singleName">Full Name <span style="color:red;">*</span></label>
                            <input type="text" id="singleName" name="singleName" placeholder="e.g., Foluso Afolabi" required>
                        </div>

                        <div class="form-group">
                            <label for="singleDepartment">Department <span style="color:red;">*</span></label>
                            <input type="text" id="singleDepartment" name="singleDepartment" placeholder="e.g., Chemistry" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="singleBtn">
                            🔍 Search Single Profile
                        </button>
                    </div>
                </form>
            </div>

            <!-- Bulk Upload Section -->
            <div class="search-section">
                <h2 style="margin-bottom: 20px; color: #333;">Upload Document to Crawl</h2>
                
                <div id="statusMessage" class="status-message"></div>
                
                <form id="uploadForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="department">Department Name <span style="color:red;">*</span></label>
                            <input type="text" id="department" name="department" placeholder="e.g., Chemistry" required>
                            <small style="color: #666; margin-top: 4px;">This department will be applied to all names in the document.</small>
                        </div>
                        
                        <div class="form-group">
                            <label for="file">Document (.json, .csv, .xlsx, .xls) <span style="color:red;">*</span></label>
                            <input type="file" id="file" name="file" accept=".json,.csv,.xlsx,.xls" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="crawlBtn">
                            🚀 Start Bulk Crawl
                        </button>
                    </div>
                </form>
                
                <div id="progressContainer" class="progress-container">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; color: #333;">
                        <span id="progressText">Processing...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <h2 style="color: #333;">Results DB</h2>
                <div class="download-buttons">
                    <button class="btn btn-success" onclick="downloadCSV()" id="downloadCsvBtn">
                        📥 Download CSV
                    </button>
                    <button class="btn btn-success" onclick="downloadExcel()" id="downloadExcelBtn">
                        📥 Download Excel
                    </button>
                    <button class="btn btn-danger" onclick="clearAll()" id="clearBtn">
                        🗑️ Clear Database
                    </button>
                </div>
            </div>
            
            <div id="resultsContainer">
                <!-- Results will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        // Load results on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadResults();
        });

        // Single Profile Form
        document.getElementById('singleSearchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('singleName').value.trim();
            const department = document.getElementById('singleDepartment').value.trim();
            
            if (!name || !department) {
                showSingleStatus('Both Name and Department are required.', 'error');
                return;
            }
            
            const btn = document.getElementById('singleBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Searching...';
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, department: department })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSingleStatus(`✓ Found: ${name}`, 'success');
                    document.getElementById('singleSearchForm').reset();
                    loadResults();
                } else {
                    showSingleStatus(`✗ Error: ${result.error}`, 'error');
                }
            } catch (error) {
                showSingleStatus(`✗ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Search Single Profile';
            }
        });
        
        // Bulk Upload Form
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const department = document.getElementById('department').value.trim();
            const fileInput = document.getElementById('file');
            
            if (!department) {
                showStatus('Department is required.', 'error');
                return;
            }
            if (!fileInput.files.length) {
                showStatus('Please upload a document.', 'error');
                return;
            }
            
            const file = fileInput.files[0];
            const allowedExts = ['json', 'csv', 'xlsx', 'xls'];
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (!allowedExts.includes(ext)) {
                showStatus('Invalid file type. Only JSON, CSV, and Excel are allowed.', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('department', department);
            formData.append('file', file);
            
            const btn = document.getElementById('crawlBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Crawl in Progress...';
            
            document.getElementById('progressContainer').style.display = 'block';
            updateProgress(0, "Starting upload...");
            
            try {
                // Poll for progress
                const pollInterval = setInterval(checkProgress, 2000);
                
                const response = await fetch('/api/bulk_crawl', {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(pollInterval);
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✓ Crawl Complete! Successfully processed document.`, 'success');
                    updateProgress(100, "Complete!");
                    document.getElementById('uploadForm').reset();
                    loadResults();
                } else {
                    showStatus(`✗ Error: ${result.error}`, 'error');
                    document.getElementById('progressContainer').style.display = 'none';
                }
            } catch (error) {
                showStatus(`✗ Connection Error: ${error.message}`, 'error');
                document.getElementById('progressContainer').style.display = 'none';
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Start Bulk Crawl';
            }
        });
        
        async function checkProgress() {
            try {
                const response = await fetch('/api/crawl_progress');
                const data = await response.json();
                if (data && data.total > 0) {
                    const pct = Math.round((data.current / data.total) * 100);
                    updateProgress(pct, `Processed ${data.current} of ${data.total} names...`);
                }
            } catch (e) {
                console.log("Could not fetch progress");
            }
        }
        
        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressText').textContent = text;
        }
        
        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const results = await response.json();
                
                document.getElementById('totalCount').textContent = results.length;
                const container = document.getElementById('resultsContainer');
                
                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No data in the database</h3>
                            <p>Upload a document above or search for a single profile to start.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Citations</th>
                                <th>H-index</th>
                                <th>i10-index</th>
                                <th>Profile Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                results.forEach(result => {
                    const statusText = result.Citations_All !== "N/A" ? "✅ Found" : "❌ Not Found";
                    html += `
                        <tr>
                            <td><strong>${result.name || result.Name}</strong></td>
                            <td>${result.Department || result.department || 'N/A'}</td>
                            <td>
                                <strong>${result.Citations_All || 'N/A'}</strong> / ${result.Citations_Since_2021 || 'N/A'}
                            </td>
                            <td>
                                <strong>${result.H_Index_All || 'N/A'}</strong> / ${result.H_Index_Since_2021 || 'N/A'}
                            </td>
                            <td>
                                <strong>${result.I10_Index_All || 'N/A'}</strong> / ${result.I10_Index_Since_2021 || 'N/A'}
                            </td>
                            <td>${statusText}</td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading results:', error);
            }
        }
        
        async function clearAll() {
            if (!confirm('Clear ALL results? This cannot be undone.')) return;
            try {
                await fetch('/api/clear', { method: 'POST' });
                loadResults();
                showStatus('All results cleared', 'success');
                showSingleStatus('All results cleared', 'success');
            } catch (error) {
                showStatus('Error clearing results', 'error');
            }
        }
        
        function downloadCSV() { window.location.href = '/api/download/csv'; }
        function downloadExcel() { window.location.href = '/api/download/excel'; }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status-message status-${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            if (type !== 'loading') {
                setTimeout(() => { statusEl.style.display = 'none'; }, 8000);
            }
        }

        function showSingleStatus(message, type) {
            const statusEl = document.getElementById('singleStatusMessage');
            statusEl.className = `status-message status-${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            if (type !== 'loading') {
                setTimeout(() => { statusEl.style.display = 'none'; }, 8000);
            }
        }
    </script>
</body>
</html>
