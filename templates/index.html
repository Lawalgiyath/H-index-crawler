<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Scholar Metrics Scraper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 8px;
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .search-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr auto;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            align-self: flex-end;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .results-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .download-buttons {
            display: flex;
            gap: 10px;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        
        .results-table thead {
            background: #f8f9fa;
        }
        
        .results-table th {
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: #666;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .results-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        
        .results-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 Google Scholar Metrics Scraper</h1>
            <p class="subtitle">Search and collect Google Scholar metrics one person at a time</p>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalCount">{{ count }}</div>
                    <div class="stat-label">Total Profiles</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="sessionCount">0</div>
                    <div class="stat-label">Added This Session</div>
                </div>
            </div>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <h2 style="margin-bottom: 20px; color: #333;">Add New Profile</h2>
            
            <div id="statusMessage" class="status-message"></div>
            
            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="e.g., Lawrence">
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="e.g., Ekebafe">
                    </div>
                    
                    <div class="form-group">
                        <label for="affiliation">Affiliation (Optional)</label>
                        <input type="text" id="affiliation" name="affiliation" placeholder="University of Lagos" value="University of Lagos">
                    </div>

                    <div style="text-align: center; margin: 10px 0; color: #666; font-weight: bold;">OR</div>

                    <div class="form-group">
                        <label for="profileUrl">Direct Profile URL (Highly Recommended for accuracy)</label>
                        <input type="text" id="profileUrl" name="profileUrl" placeholder="https://scholar.google.com/citations?user=...">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="searchBtn">
                        🔍 Search
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <h2 style="color: #333;">Results</h2>
                <div class="download-buttons">
                    <button class="btn btn-success" onclick="downloadCSV()" id="downloadCsvBtn">
                        📥 Download CSV
                    </button>
                    <button class="btn btn-success" onclick="downloadExcel()" id="downloadExcelBtn">
                        📥 Download Excel
                    </button>
                    <button class="btn btn-danger" onclick="clearAll()" id="clearBtn">
                        🗑️ Clear All
                    </button>
                </div>
            </div>
            
            <div id="resultsContainer">
                <!-- Results will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        let sessionCount = 0;
        
        // Load results on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadResults();
        });
        
        // Search form submission
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const affiliation = document.getElementById('affiliation').value.trim();
            const profileUrl = document.getElementById('profileUrl').value.trim();
            
            if (!profileUrl && (!firstName || !lastName)) {
                showStatus('Please enter either a Direct Profile URL OR both first and last name', 'error');
                return;
            }
            
            // Disable button and show loading
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = '🔄 Searching...';
            
            if (profileUrl) {
                showStatus('Extracting profile from URL...', 'loading');
            } else {
                showStatus(`Searching for ${firstName} ${lastName}...`, 'loading');
            }
            
            const searchPayload = {
                first_name: profileUrl ? profileUrl : firstName,
                last_name: profileUrl ? "" : lastName,
                affiliation: affiliation
            };
            
            try {
                const response = await fetch('/search_individual', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(searchPayload)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`✓ Found: ${result.name}`, 'success');
                    
                    // Clear form
                    document.getElementById('firstName').value = '';
                    document.getElementById('lastName').value = '';
                    
                    // Update session count
                    sessionCount++;
                    document.getElementById('sessionCount').textContent = sessionCount;
                    
                    // Reload results
                    loadResults();
                } else {
                    showStatus(`✗ ${result.error}`, 'error');
                }
            } catch (error) {
                showStatus(`✗ Error: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Search';
            }
        });
        
        async function loadResults() {
            try {
                const response = await fetch('/api/results');
                const results = await response.json();
                
                document.getElementById('totalCount').textContent = results.length;
                
                const container = document.getElementById('resultsContainer');
                
                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
                            </svg>
                            <h3>No results yet</h3>
                            <p>Start by searching for a scholar above</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Citations</th>
                                <th>H-index</th>
                                <th>i10-index</th>
                                <th>Affiliation</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                results.forEach(result => {
                    html += `
                        <tr>
                            <td>
                                <strong>${result.name}</strong><br>
                                <small style="color: #999;">${result.user_id}</small>
                            </td>
                            <td>
                                <strong>${result.citations_all}</strong> / ${result.citations_since}
                                <br><small style="color: #999;">All / Since 2021</small>
                            </td>
                            <td>
                                <strong>${result.h_index_all}</strong> / ${result.h_index_since}
                                <br><small style="color: #999;">All / Since 2021</small>
                            </td>
                            <td>
                                <strong>${result.i10_index_all}</strong> / ${result.i10_index_since}
                                <br><small style="color: #999;">All / Since 2021</small>
                            </td>
                            <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                ${result.affiliation}
                            </td>
                            <td>
                                <button class="delete-btn" onclick="deleteResult('${result.user_id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += `
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading results:', error);
            }
        }
        
        async function deleteResult(userId) {
            if (!confirm('Delete this profile?')) return;
            
            try {
                await fetch(`/api/delete/${userId}`, { method: 'DELETE' });
                loadResults();
                showStatus('Profile deleted', 'success');
            } catch (error) {
                showStatus('Error deleting profile', 'error');
            }
        }
        
        async function clearAll() {
            if (!confirm('Clear ALL results? This cannot be undone.')) return;
            
            try {
                await fetch('/api/clear', { method: 'POST' });
                loadResults();
                sessionCount = 0;
                document.getElementById('sessionCount').textContent = 0;
                showStatus('All results cleared', 'success');
            } catch (error) {
                showStatus('Error clearing results', 'error');
            }
        }
        
        function downloadCSV() {
            window.location.href = '/api/download/csv';
        }
        
        function downloadExcel() {
            window.location.href = '/api/download/excel';
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status-message status-${type}`;
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            
            if (type !== 'loading') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
